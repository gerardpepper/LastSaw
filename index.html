
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Last Saw</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Baloo+2:wght@600;800&display=swap">
<style>
  html,body{height:100%;}
  body{margin:0;background:#15230f;display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:"Baloo 2",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #stage{position:relative;width:100%;height:100%;container-type:size;background:#8ec9f0;touch-action:manipulation;overflow:hidden;}
  canvas{display:block;width:100%;height:100%;object-fit:contain;}
  .ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:7cqw;box-sizing:border-box;}
  .ui .inner{max-width:90cqw;}
  .big-btn{font-family:inherit;font-weight:800;color:#fff;font-size:clamp(20px,6cqw,30px);
    background:linear-gradient(#e0b84f,#e6b422);border:none;border-radius:16px;padding:14px 32px;cursor:pointer;box-shadow:0 6px 0 #a87f12;}
  .big-btn:active{transform:translateY(5px);box-shadow:0 1px 0 #a87f12;}
  .title-fx{font-family:"MedievalSharp",serif;color:#f6e7b0;font-size:clamp(48px,17cqw,96px);line-height:1;
    text-shadow:3px 3px 0 #5a3b12,0 0 20px rgba(0,0,0,.5);}
  .story-txt{color:#f6e7b0;font-weight:800;font-size:clamp(16px,4.6cqw,24px);line-height:1.4;text-shadow:0 2px 6px rgba(0,0,0,.6);}
  .win-txt{font-family:"MedievalSharp",serif;color:#fff;font-size:clamp(22px,6.5cqw,40px);line-height:1.25;text-shadow:2px 2px 0 #7d1d13;}
  .hintline{color:#f6e7b0;font-weight:800;font-size:clamp(13px,3.6cqw,18px);margin-top:14px;opacity:.9;}
  .round-btn{position:absolute;right:5cqw;bottom:6cqw;z-index:6;
    width:clamp(58px,16cqw,82px);height:clamp(58px,16cqw,82px);border-radius:50%;
    border:4px solid #fff;background:linear-gradient(#e0b84f,#e6b422);color:#fff;
    font-size:clamp(26px,7cqw,36px);cursor:pointer;box-shadow:0 5px 0 #a87f12;}
  .round-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #a87f12;}
  [hidden]{display:none!important;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="420" height="720"></canvas>

  <div class="ui" id="storyUI">
    <div class="inner">

      <div class="hintline">tocca per continuare ▸</div>
    </div>
  </div>

  <div class="ui" id="titleUI" hidden>
    <div class="inner">
      <div class="title-fx">Last<br>Saw</div>
      <div style="font-size:16cqw;margin:6px 0 14px;">🖐️🪚</div>
      <button class="big-btn" id="startBtn">INIZIA</button>
    </div>
  </div>

  <button class="round-btn" id="againBtn" hidden aria-label="Ricomincia">🔁</button>
</div>

  function playToasty(){ toastyPop=TOASTY_DUR; if(toasty){ try{ toasty.currentTime=0; toasty.play(); }catch(e){} } }
  let obs=null, oi=0, scroll=0, glasses=0, mauroY=0, vy=0, onGround=true, running=false,
      sawTaps=0, sawAnim=0, legPhase=0, toastTx='', toastT=0,
      fader=null, caveMode=false, caveX=0, annaOut=0, finDone=false;
  const againBtn=document.getElementById('againBtn');

  function buildObs(){
    obs=[]; let x=560;
    for(const p of PLAN){
      const w = p.t==='river' ? 86 : (46 + (p.taps-8)*2.4);
      obs.push(Object.assign({worldX:x, w, cut:0, fallen:false, done:false}, p));
      x += 360 + w;
    }
  }
  function startPlay(){
    buildObs(); oi=0; scroll=0; glasses=0; mauroY=0; vy=0; onGround=true; running=true;
    sawTaps=0; sawAnim=0; legPhase=0; toastT=0;
    fader=null; caveMode=false; caveX=0; annaOut=0; finDone=false; againBtn.hidden=true;
    titleUI.hidden=true; state=STATE.PLAY;
  }
  function toast(t){ toastTx=t; toastT=90; }

  // ===== STORY =====
  const STORY=[
    "In un regno lontano, la principessa <b>Annalisa</b> è rinchiusa in una caverna…",
    "Un enorme tronco sbarra l'ingresso. Lei piange guardando il poster del suo principe <b>Mauro</b>.",
    "Solo Mauro può salvarla: attraverserà il bosco tra <b>tronchi</b> e <b>torrenti</b>, armato di una <b>sega</b>! 🪚"
  ];
  let si=0; function showStory(){ storyText.innerHTML=STORY[si]; }
  showStory();

  // ================= helpers =================
  function rr(x,y,w,h,r){ r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2); ctx.beginPath(); ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function pill(text,cx,y,bg,fg,fs){
    ctx.font='800 '+(fs||16)+'px Baloo 2, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const w=Math.min(W-20, ctx.measureText(text).width+28), h=(fs||16)+16;
    ctx.fillStyle=bg; rr(cx-w/2,y-h/2,w,h,h/2); ctx.fill();
    ctx.fillStyle=fg; ctx.fillText(text,cx,y);
  }

  // ================= drawing =================
  function treeline(){
    ctx.fillStyle='#2f6d33';
    for(let i=0;i<8;i++){
      const x=((i*120 - scroll*0.3)%(W+120)+W+120)%(W+120)-60;
      ctx.beginPath(); ctx.moveTo(x,GROUND-6); ctx.lineTo(x-40,GROUND+30); ctx.lineTo(x+40,GROUND+30); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x,GROUND-40); ctx.lineTo(x-34,GROUND+2); ctx.lineTo(x+34,GROUND+2); ctx.closePath(); ctx.fill();
    }
  }
  function bg(){
    ctx.fillStyle='#8ec9f0'; ctx.fillRect(0,0,W,H);
    // clouds
    ctx.fillStyle='rgba(255,255,255,.85)';
    for(let i=0;i<3;i++){ const x=((i*180 - scroll*0.12)%(W+180)+W+180)%(W+180)-90, y=70+i*46;
      ctx.beginPath(); ctx.arc(x,y,20,0,7); ctx.arc(x+24,y+6,15,0,7); ctx.arc(x-22,y+6,13,0,7); ctx.fill(); }
    treeline();
    // ground
    ctx.fillStyle='#6b4a2b'; ctx.fillRect(0,GROUND,W,H-GROUND);
    ctx.fillStyle='#4e8c3a'; ctx.fillRect(0,GROUND,W,14);
    // dino-style dashes on the ground
    ctx.strokeStyle='rgba(0,0,0,.18)'; ctx.lineWidth=3;
    const off=((scroll)%40+40)%40;
    for(let x=-off;x<W;x+=40){ ctx.beginPath(); ctx.moveTo(x,GROUND+34); ctx.lineTo(x+16,GROUND+34); ctx.stroke(); }
  }
  function drawRiver(ob,sx){
    const w=ob.w;
    ctx.fillStyle='#2e78c0'; ctx.fillRect(sx,GROUND+2,w,H-GROUND);
    ctx.fillStyle='#5ba3e0'; for(let i=0;i<w;i+=16){ ctx.fillRect(sx+i,GROUND+6+Math.sin(frame*0.12+i)*3,10,4); }
    // sign + two-line name (kept inside its board)
    const bx=sx+w/2;
    ctx.fillStyle='#7a4a22'; ctx.fillRect(bx-3,GROUND-78,6,78);
    ctx.fillStyle='#f2e3c0'; rr(bx-62,GROUND-120,124,46,6); ctx.fill();
    ctx.strokeStyle='#7a4a22'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle='#3a2612'; ctx.textAlign='center';
    ctx.font='700 12px Baloo 2, sans-serif'; ctx.textBaseline='alphabetic';
    ctx.fillText('Torrente', bx, GROUND-100); ctx.fillText(ob.name, bx, GROUND-83);
  }
  function blob(x,y,r){ ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
  // whole TREE: trunk + leafy crown, both thicker/taller for higher taps; tips over when sawn
  function drawTree(ob,sx){
    const cx=sx+ob.w/2, tw=ob.w;              // trunk width = thickness (grows along the level)
    const th=78+(ob.taps-8)*4.2;              // trunk height grows too
    const cr=tw*0.78+34;                      // crown radius grows with thickness
    ctx.save();
    ctx.translate(cx, GROUND);                 // pivot at the base
    if(ob.fallen) ctx.rotate(Math.PI/2*Math.min(1,ob.tip||0));   // fall to the right, away from Mauro
    // --- trunk (local coords: base at 0,0 going up) ---
    ctx.fillStyle='#8a5a2b'; rr(-tw/2,-th,tw,th,7); ctx.fill();
    ctx.strokeStyle='#5a3b1e'; ctx.lineWidth=3; ctx.stroke();
    ctx.strokeStyle='#6b451f'; ctx.lineWidth=2; ctx.beginPath();
    ctx.moveTo(-tw*0.12,-th*0.2); ctx.lineTo(-tw*0.12,-th*0.85);
    ctx.moveTo(tw*0.18,-th*0.35); ctx.lineTo(tw*0.18,-th*0.8); ctx.stroke();
    // --- leafy crown ---
    const ccy=-th-cr*0.35;
    ctx.fillStyle='#2f8f3f';
    blob(0,ccy,cr); blob(-cr*0.8,ccy+cr*0.35,cr*0.72); blob(cr*0.8,ccy+cr*0.35,cr*0.72); blob(0,ccy-cr*0.55,cr*0.7);
    ctx.fillStyle='#43ab4f';
    blob(-cr*0.3,ccy-cr*0.15,cr*0.6); blob(cr*0.35,ccy-cr*0.1,cr*0.55); blob(0,ccy+cr*0.1,cr*0.55);
    ctx.fillStyle='#5ec469';
    blob(-cr*0.15,ccy-cr*0.35,cr*0.32); blob(cr*0.2,ccy-cr*0.28,cr*0.26);
    ctx.restore();
    // --- saw notch at the base (only while standing), on Mauro's side ---
    if(!ob.fallen && ob.cut>0){
      const nd=tw*0.9*ob.cut, ny=GROUND-18;
      ctx.fillStyle='#3a2612'; ctx.beginPath();
      ctx.moveTo(sx,ny-11); ctx.lineTo(sx+nd,ny); ctx.lineTo(sx,ny+11); ctx.closePath(); ctx.fill();
    }
  }
  function drawLog(ob,sx){ drawTree(ob,sx); }   // obstacle is a tree now

  function drawMauro(px){
    const x=(px==null?MX:px), feet=GROUND+mauroY, r=40, bodyTop=feet-96, headCy=bodyTop-r+6;
    // legs (run cycle / tuck in air)
    ctx.strokeStyle='#5a3b28'; ctx.lineWidth=9; ctx.lineCap='round';
    if(onGround && running){
      const s=Math.sin(legPhase)*12;
      ctx.beginPath(); ctx.moveTo(x-9,feet-22); ctx.lineTo(x-9+s,feet); ctx.moveTo(x+9,feet-22); ctx.lineTo(x+9-s,feet); ctx.stroke();
    } else if(!onGround){
      ctx.beginPath(); ctx.moveTo(x-9,feet-22); ctx.lineTo(x-16,feet-6); ctx.moveTo(x+9,feet-22); ctx.lineTo(x+16,feet-6); ctx.stroke();
    } else { ctx.beginPath(); ctx.moveTo(x-9,feet-22); ctx.lineTo(x-9,feet); ctx.moveTo(x+9,feet-22); ctx.lineTo(x+9,feet); ctx.stroke(); }
    // tunic
    ctx.fillStyle='#3a6ea5'; ctx.beginPath(); ctx.moveTo(x-24,feet-20); ctx.lineTo(x+24,feet-20);
    ctx.lineTo(x+18,bodyTop); ctx.lineTo(x-18,bodyTop); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#e6b422'; ctx.fillRect(x-5,bodyTop,10,feet-20-bodyTop);
    // back arm
    ctx.strokeStyle='#3a6ea5'; ctx.lineWidth=10;
    ctx.beginPath(); ctx.moveTo(x-6,bodyTop+14); ctx.lineTo(x-24,bodyTop+36); ctx.stroke();
    // head (cut-out photo)
    if(mauro.complete && mauro.naturalWidth) ctx.drawImage(mauro, x-r, headCy-r, r*2, r*2);
    else { ctx.fillStyle='#ffe0b8'; ctx.beginPath(); ctx.arc(x,headCy,r,0,7); ctx.fill(); }
    // crown
    ctx.fillStyle='#e6b422'; ctx.beginPath(); ctx.moveTo(x-22,headCy-r*0.78); ctx.lineTo(x-11,headCy-r*1.12);
    ctx.lineTo(x,headCy-r*0.82); ctx.lineTo(x+11,headCy-r*1.12); ctx.lineTo(x+22,headCy-r*0.78); ctx.closePath(); ctx.fill();
    // thick "diopter" lenses over the eyes
    if(glasses>0){
      const ey=headCy-2, lx=13, R=11+glasses*0.9;   // thick-lens effect (grows per diopter)
      for(const side of [-1,1]){
        const cxE=x+side*lx;
        ctx.save(); ctx.globalAlpha=0.13+0.05*glasses; ctx.fillStyle='#d4f0ff'; ctx.beginPath(); ctx.arc(cxE,ey,R,0,7); ctx.fill(); ctx.restore();
        ctx.save(); ctx.globalAlpha=0.5; ctx.strokeStyle='#eaf8ff'; ctx.lineWidth=1.4;
        for(let k=1;k<=glasses;k++){ ctx.beginPath(); ctx.arc(cxE,ey,R*(1-k*0.11),0,7); ctx.stroke(); }
        ctx.restore();
        ctx.save(); ctx.globalAlpha=0.65; ctx.strokeStyle='#fff'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(cxE,ey,R*0.66,Math.PI*1.05,Math.PI*1.5); ctx.stroke(); ctx.restore();
      }
    }
    // front arm + saw (sawing)
    const ob=obs&&obs[oi];
    const sawing = ob && ob.t==='log' && !ob.fallen && !running;
    const ax=x+10, ay=bodyTop+16;
    ctx.strokeStyle='#3a6ea5'; ctx.lineWidth=10;
    if(sawing){
      const push=Math.sin(sawAnim)*16;
      const hx=x+30+push, hy=ay+18;
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(hx,hy); ctx.stroke();
      // saw blade
      ctx.save(); ctx.translate(hx,hy);
      ctx.fillStyle='#7a4a22'; ctx.fillRect(-6,-7,14,14);
      ctx.fillStyle='#c9ccd2'; ctx.beginPath(); ctx.moveTo(8,-6); ctx.lineTo(46,-6); ctx.lineTo(46,4); ctx.lineTo(8,4); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#8a8f98'; ctx.lineWidth=1; for(let i=8;i<46;i+=5){ ctx.beginPath(); ctx.moveTo(i,4); ctx.lineTo(i+2,8); ctx.stroke(); }
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(x+22,ay+24); ctx.stroke();
    }
  }

  function drawHUD(){
    const ob = obs ? obs[oi] : null;
    if(ob && state===STATE.PLAY){
      if(ob.t==='log' && !ob.fallen && !running){
        pill('🪚 TOCCA per segare!  '+sawTaps+'/'+ob.taps, W/2, 44, 'rgba(0,0,0,.35)', '#fff', 16);
      } else if(ob.t==='river'){
        pill('TOCCA per saltare il torrente!', W/2, 44, 'rgba(0,0,0,.35)', '#fff', 15);
      }
    }
    if(toastT>0){ pill(toastTx, W/2, 120, '#c0392b', '#fff', 20); }
  }

  // ===== cave / animated finale =====
  function heart(x,y,s){ ctx.save(); ctx.translate(x,y); ctx.beginPath();
    ctx.moveTo(0,s*0.3); ctx.bezierCurveTo(s,-s*0.6,s*1.2,s*0.5,0,s*1.2); ctx.bezierCurveTo(-s*1.2,s*0.5,-s,-s*0.6,0,s*0.3); ctx.fill(); ctx.restore(); }
  function drawPrincess(px, a){
    ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,a*1.5));
    const abtop=GROUND-120, ar=34;
    ctx.fillStyle='#ff9ec4'; ctx.beginPath(); ctx.moveTo(px-24,GROUND); ctx.lineTo(px+24,GROUND); ctx.lineTo(px+13,abtop+ar); ctx.lineTo(px-13,abtop+ar); ctx.closePath(); ctx.fill();
    if(anna.complete&&anna.naturalWidth) ctx.drawImage(anna, px-ar, abtop-ar, ar*2, ar*2);
    else { ctx.fillStyle='#ffe0b8'; ctx.beginPath(); ctx.arc(px,abtop,ar,0,7); ctx.fill(); }
    ctx.fillStyle='#e6b422'; ctx.beginPath(); ctx.moveTo(px-16,abtop-ar*0.8); ctx.lineTo(px-8,abtop-ar*1.18); ctx.lineTo(px,abtop-ar*0.85); ctx.lineTo(px+8,abtop-ar*1.18); ctx.lineTo(px+16,abtop-ar*0.8); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  function renderCave(){
    const cx=caveX;
    ctx.fillStyle='#5a4a38'; ctx.beginPath(); ctx.moveTo(cx-98,GROUND); ctx.quadraticCurveTo(cx,GROUND-176,cx+98,GROUND); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#17110c'; ctx.beginPath(); ctx.moveTo(cx-42,GROUND); ctx.quadraticCurveTo(cx-42,GROUND-98,cx,GROUND-98); ctx.quadraticCurveTo(cx+42,GROUND-98,cx+42,GROUND); ctx.closePath(); ctx.fill();
    if(annaOut>0){
      const px=cx - 8 - annaOut*36;             // the princess steps out to the left
      drawPrincess(px, annaOut);
      if(annaOut>0.35){ ctx.fillStyle='#e0403a'; for(let i=0;i<6;i++){ const hx=(MX+px)/2+Math.sin(frame*0.08+i)*20, hy=GROUND-140-((frame*1.2+i*26)%150); heart(hx,hy,8); } }
    }
  }
  function drawFinaleText(){
    ctx.fillStyle='rgba(0,0,0,.30)'; const w=W-30; rr((W-w)/2, 22, w, 72, 14); ctx.fill();
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='700 20px MedievalSharp, serif';
    ctx.fillText('…e vissero per sempre', W/2, 46); ctx.fillText('felici e contenti 💍', W/2, 74);
  }
  // ================= loop =================
  function update(dt){
    frame+=dt;
    if(toastT>0) toastT-=dt;
    if(toastyPop>0) toastyPop-=dt;                               // MK corner bust timer
    if(fader){ fader.a-=dt*0.045; if(fader.a<=0) fader=null; }   // river dissolves away
    if(state!==STATE.PLAY) return;

    if(caveMode){                                   // animated finale
      if(running){ legPhase+=dt*0.35; scroll+=SPEED*dt; caveX-=SPEED*dt; if(caveX<=W-150){ caveX=W-150; running=false; } }
      else if(annaOut<1){ annaOut+=dt*0.015; if(annaOut>1) annaOut=1; }
      else if(!finDone){ finDone=true; againBtn.hidden=false; }
      return;
    }

    if(onGround && running) legPhase+=dt*0.35;
    if(!onGround || mauroY<0){ mauroY+=vy*dt; vy+=GRAV*dt; if(mauroY>=0){ mauroY=0; vy=0; onGround=true; } }
    if(running) scroll+=SPEED*dt;
    if(sawAnim>0) sawAnim-=dt*0.4;

    const ob=obs[oi]; if(!ob) return;
    const sx=ob.worldX-scroll;
    if(ob.t==='log'){
      if(!ob.fallen){
        if(running && sx<=MX+44){ running=false; scroll=ob.worldX-(MX+44); }
      } else {
        ob.tip=Math.min(1,(ob.tip||0)+dt*0.07);   // tree tips over
        if(sx+ob.w < MX-20){ ob.done=true; oi++; running=true; sawTaps=0; }
      }
    } else { // river
      const l=sx, r=sx+ob.w, foot=MX;
      if(onGround && foot>l+4 && foot<r-4){ toast('💦 Splash!'); scroll=ob.worldX-(MX+150); mauroY=0; vy=0; onGround=true; }
      if(r < MX-6){ fader={worldX:ob.worldX, w:ob.w, name:ob.name, a:1}; ob.done=true; oi++; }
    }
  }
  function drawToastyPop(){
    if(toastyPop<=0 || !toastyImg.complete || !toastyImg.naturalWidth) return;
    const visIn=Math.min(1,(TOASTY_DUR-toastyPop)/TOASTY_IN), visOut=Math.min(1,toastyPop/TOASTY_OUT);
    const vis=Math.max(0,Math.min(visIn,visOut));
    const pw=Math.min(150,W*0.42), ph=pw*(toastyImg.naturalHeight/toastyImg.naturalWidth);
    const x=W-pw-10, y=(H-ph-8)+(1-vis)*(ph+16);              // slides up from below the edge
    ctx.save();
    ctx.fillStyle='#111'; rr(x-4,y-4,pw+8,ph+8,7); ctx.fill();
    ctx.strokeStyle='#ffd23c'; ctx.lineWidth=3; rr(x-4,y-4,pw+8,ph+8,7); ctx.stroke();
    ctx.save(); rr(x,y,pw,ph,4); ctx.clip(); ctx.drawImage(toastyImg,x,y,pw,ph); ctx.restore();
    ctx.restore();
  }
  function render(){ renderScene(); drawToastyPop(); }
  function renderScene(){
    bg();
    if(state!==STATE.PLAY){ drawMauro(); return; }            // story / title: idle Mauro
    if(caveMode){ renderCave(); drawMauro(); if(finDone) drawFinaleText(); return; }
    for(let i=oi;i<(obs?obs.length:0);i++){ const ob=obs[i], sx=ob.worldX-scroll; if(sx>W+120) break; if(sx<-160) continue;
      if(ob.t==='river') drawRiver(ob,sx); else drawLog(ob,sx); }
    if(fader){ ctx.save(); ctx.globalAlpha=fader.a; drawRiver(fader, fader.worldX-scroll); ctx.restore(); }
    drawMauro();
    drawHUD();
  }
  function loop(now){ if(!loop.t)loop.t=now||0; let dt=((now||0)-loop.t)/(1000/60); loop.t=now||0; if(dt>3)dt=3; if(dt<0)dt=0;
    update(dt); render(); requestAnimationFrame(loop); }

  // ================= input =================
  function handleTap(){
    if(state===STATE.STORY){ si++; if(si>=STORY.length){ storyUI.hidden=true; state=STATE.TITLE; titleUI.hidden=false; } else showStory(); return; }
    if(state===STATE.PLAY){
      if(caveMode) return;                         // finale running: ignore taps
      const ob=obs[oi]; if(!ob) return;
      if(ob.t==='log' && !ob.fallen && !running){
        sawTaps++; sawAnim=Math.PI*2; ob.cut=Math.min(1,sawTaps/ob.taps); sawSound();
        if(sawTaps>=ob.taps){ glasses=Math.min(5,glasses+1); toast('👓 -2 diottrie!'); ob.fallen=true; ob.tip=0; playToasty();
          if(ob.cave){ caveMode=true; running=true; caveX=W+160; annaOut=0; finDone=false; }   // start animated finale
          else { running=true; sawTaps=0; } }
      } else if(onGround){ vy=-JUMP; onGround=false; }   // jump (rivers)
    }
  }
  stage.addEventListener('pointerdown', function(e){ if(e.target.closest('button')) return; handleTap(); });
  document.getElementById('startBtn').addEventListener('click', startPlay);
  againBtn.addEventListener('click', function(){ againBtn.hidden=true; caveMode=false; si=0; showStory(); storyUI.hidden=false; state=STATE.STORY; });

  requestAnimationFrame(loop);
})();
</script>
</body>
